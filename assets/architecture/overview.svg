<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">NX AI Assistant M2 high-level architecture</title>
  <desc id="desc">UI flows to Planner, Skill Plan, Confirmation, and an Execution Boundary. Beyond the boundary, the high-level NX Agent interface connects to NXOpen. Internal implementation details are omitted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .box { rx: 16; ry: 16; stroke-width: 2; }
      .label { font: 600 20px 'Segoe UI', Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; fill: #0f172a; }
      .small { font: 15px 'Segoe UI', Arial, sans-serif; text-anchor: middle; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="360" fill="#f8fafc"/>
  <rect x="1120" y="54" width="455" height="220" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 8"/>
  <text class="small" x="1347" y="82">PRIVATE EXECUTION SIDE · HIGH-LEVEL ONLY</text>
  <g class="arrow">
    <line x1="230" y1="176" x2="268" y2="176"/>
    <line x1="449" y1="176" x2="487" y2="176"/>
    <line x1="668" y1="176" x2="706" y2="176"/>
    <line x1="887" y1="176" x2="925" y2="176"/>
    <line x1="1106" y1="176" x2="1144" y2="176"/>
    <line x1="1325" y1="176" x2="1363" y2="176"/>
  </g>
  <g>
    <rect class="box" x="55" y="126" width="175" height="100" fill="#e0f2fe" stroke="#38bdf8"/>
    <text class="label" x="142" y="176">UI</text>
    <rect class="box" x="274" y="126" width="175" height="100" fill="#dbeafe" stroke="#60a5fa"/>
    <text class="label" x="361" y="176">Planner</text>
    <rect class="box" x="493" y="126" width="175" height="100" fill="#ede9fe" stroke="#a78bfa"/>
    <text class="label" x="580" y="176">Skill Plan</text>
    <rect class="box" x="712" y="126" width="175" height="100" fill="#dcfce7" stroke="#4ade80"/>
    <text class="label" x="799" y="176">Confirmation</text>
    <rect class="box" x="931" y="126" width="175" height="100" fill="#fef3c7" stroke="#f59e0b"/>
    <text class="label" x="1018" y="162">Execution</text>
    <text class="label" x="1018" y="190">Boundary</text>
    <rect class="box" x="1150" y="126" width="175" height="100" fill="#e2e8f0" stroke="#94a3b8"/>
    <text class="label" x="1237" y="176">NX Agent</text>
    <rect class="box" x="1369" y="126" width="175" height="100" fill="#e2e8f0" stroke="#94a3b8"/>
    <text class="label" x="1456" y="176">NXOpen</text>
  </g>
  <text class="small" x="800" y="320">Inspectable plan → human confirmation before mutation → real NX execution</text>
</svg>
